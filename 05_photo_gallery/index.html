<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="gallery-header">
        <h1>Moments Captured</h1>
        <p>A collection of beautiful photography</p>
        
        <div class="filter-buttons">
            <button class="filter-btn active">All</button>
            <button class="filter-btn">Nature</button>
            <button class="filter-btn">Travel</button>
            <button class="filter-btn">City</button>
            <button class="filter-btn">Technology</button>
        </div>
    </header>

    <main class="gallery-container">
        <!-- Note: Real filtering requires JS. The classes are added here for structural purposes based on the prompt's requirements -->
        
        <div class="gallery-item nature">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=800&auto=format&fit=crop" alt="Forest Path">
            <div class="caption">
                <h3>Mystic Forest</h3>
                <p>Nature</p>
            </div>
        </div>

        <div class="gallery-item city">
            <img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?q=80&w=800&auto=format&fit=crop" alt="Cityscape">
            <div class="caption">
                <h3>Urban Jungle</h3>
                <p>City</p>
            </div>
        </div>

        <div class="gallery-item travel">
            <img src="https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?q=80&w=800&auto=format&fit=crop" alt="Boat on Lake">
            <div class="caption">
                <h3>Serene Voyage</h3>
                <p>Travel</p>
            </div>
        </div>

        <div class="gallery-item technology">
            <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=800&auto=format&fit=crop" alt="Circuit Board">
            <div class="caption">
                <h3>Micro Core</h3>
                <p>Technology</p>
            </div>
        </div>

        <div class="gallery-item nature">
            <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?q=80&w=800&auto=format&fit=crop" alt="Mountain Landscape">
            <div class="caption">
                <h3>Alpine Peaks</h3>
                <p>Nature</p>
            </div>
        </div>

        <div class="gallery-item travel">
            <img src="https://images.unsplash.com/photo-1488085061387-422e29b40080?q=80&w=800&auto=format&fit=crop" alt="Airplane Wing">
            <div class="caption">
                <h3>Above Clouds</h3>
                <p>Travel</p>
            </div>
        </div>

        <div class="gallery-item city">
            <img src="https://images.unsplash.com/photo-1514565131-fce0801e5785?q=80&w=800&auto=format&fit=crop" alt="Neon Street">
            <div class="caption">
                <h3>Night Life</h3>
                <p>City</p>
            </div>
        </div>

        <div class="gallery-item technology">
            <img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?q=80&w=800&auto=format&fit=crop" alt="Server Room">
            <div class="caption">
                <h3>Data Center</h3>
                <p>Technology</p>
            </div>
        </div>

        <div class="gallery-item nature">
            <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?q=80&w=800&auto=format&fit=crop" alt="Ocean Waves">
            <div class="caption">
                <h3>Coastal Tide</h3>
                <p>Nature</p>
            </div>
        </div>

    </main>
</body>
</html>
