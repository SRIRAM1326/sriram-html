<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="cart-container">
        <header class="cart-header">
            <h1>Shopping Cart</h1>
            <span class="item-count" id="total-items">3 Items</span>
        </header>

        <div class="cart-content">
            <!-- Left Side: Product List -->
            <div class="cart-items" id="cart-items">
                <!-- Cart Item 1 -->
                <div class="cart-item" data-id="1">
                    <div class="item-image">
                        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=200&auto=format&fit=crop" alt="Red Sneakers">
                    </div>
                    <div class="item-details">
                        <h3>Aero Run Sneakers</h3>
                        <p class="item-category">Footwear</p>
                        <button class="remove-btn"><i class="fa-solid fa-trash"></i> Remove</button>
                    </div>
                    <div class="item-quantity">
                        <button class="qty-btn minus">-</button>
                        <input type="number" class="qty-input" value="1" min="1" max="10" readonly>
                        <button class="qty-btn plus">+</button>
                    </div>
                    <div class="item-price">
                        $<span class="price-val" data-price="89.99">89.99</span>
                    </div>
                </div>

                <!-- Cart Item 2 -->
                <div class="cart-item" data-id="2">
                    <div class="item-image">
                        <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=200&auto=format&fit=crop" alt="Headphones">
                    </div>
                    <div class="item-details">
                        <h3>Noise-Cancelling Headphones</h3>
                        <p class="item-category">Electronics</p>
                        <button class="remove-btn"><i class="fa-solid fa-trash"></i> Remove</button>
                    </div>
                    <div class="item-quantity">
                        <button class="qty-btn minus">-</button>
                        <input type="number" class="qty-input" value="1" min="1" max="10" readonly>
                        <button class="qty-btn plus">+</button>
                    </div>
                    <div class="item-price">
                        $<span class="price-val" data-price="249.99">249.99</span>
                    </div>
                </div>

                <!-- Cart Item 3 -->
                <div class="cart-item" data-id="3">
                    <div class="item-image">
                        <img src="https://images.unsplash.com/photo-1527443154391-507e9dc6c5cc?q=80&w=200&auto=format&fit=crop" alt="Backpack">
                    </div>
                    <div class="item-details">
                        <h3>Urban Tech Backpack</h3>
                        <p class="item-category">Accessories</p>
                        <button class="remove-btn"><i class="fa-solid fa-trash"></i> Remove</button>
                    </div>
                    <div class="item-quantity">
                        <button class="qty-btn minus">-</button>
                        <input type="number" class="qty-input" value="2" min="1" max="10" readonly>
                        <button class="qty-btn plus">+</button>
                    </div>
                    <div class="item-price">
                        $<span class="price-val" data-price="55.99">111.98</span>
                    </div>
                </div>
            </div>

            <!-- Right Side: Order Summary -->
            <div class="cart-summary">
                <h2>Order Summary</h2>
                
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>$<span id="summary-subtotal">451.96</span></span>
                </div>
                
                <div class="summary-row">
                    <span>Tax (8%)</span>
                    <span>$<span id="summary-tax">36.16</span></span>
                </div>
                
                <div class="summary-row">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>

                <div class="summary-row total">
                    <span>Grand Total</span>
                    <span>$<span id="summary-total">488.12</span></span>
                </div>

                <button class="checkout-btn">Proceed to Checkout</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
