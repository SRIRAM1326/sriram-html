<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Focus Timer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="pomodoro-app">
        
        <header>
            <h1><i class="fa-solid fa-stopwatch"></i> FocusTimer</h1>
            <button class="settings-btn" id="settings-btn"><i class="fa-solid fa-gear"></i></button>
        </header>

        <div class="timer-container">
            <!-- Mode Selector -->
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="pomodoro">Pomodoro</button>
                <button class="mode-btn" data-mode="shortBreak">Short Break</button>
                <button class="mode-btn" data-mode="longBreak">Long Break</button>
            </div>

            <!-- Timer Circle -->
            <div class="timer-circle">
                <svg class="progress-ring" width="300" height="300">
                    <circle class="progress-ring__bg" stroke-width="10" cx="150" cy="150" r="140" fill="transparent" />
                    <circle class="progress-ring__circle" stroke-width="10" stroke-linecap="round" cx="150" cy="150" r="140" fill="transparent" />
                </svg>
                <div class="time-display">
                    <span id="time">25:00</span>
                    <p id="mode-label">Focus Session</p>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button id="start-btn" class="control-btn primary">Start</button>
                <button id="reset-btn" class="control-btn secondary"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
        </div>

        <div class="stats">
            <p>Session #<span id="session-count">1</span></p>
        </div>

        <!-- Hidden Audio Element for Alarm -->
        <audio id="alarm-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
    </div>

    <script src="script.js"></script>
</body>
</html>
