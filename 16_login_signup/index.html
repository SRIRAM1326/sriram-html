<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth | Login & Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        
        <div class="auth-box">
            
            <!-- Toggle Buttons -->
            <div class="auth-toggle">
                <button id="show-login" class="toggle-btn active">Login</button>
                <button id="show-signup" class="toggle-btn">Sign Up</button>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="form-container active-form">
                <div class="form-header">
                    <h2>Welcome Back</h2>
                    <p>Enter your details to access your account.</p>
                </div>
                
                <form id="login" novalidate>
                    <div class="input-group">
                        <label for="login-email">Email Address</label>
                        <div class="input-icon">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="email" id="login-email" placeholder="hello@example.com" required>
                        </div>
                        <span class="error-msg" id="login-email-err"></span>
                    </div>

                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <div class="input-icon">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="login-password" placeholder="••••••••" required>
                            <button type="button" class="toggle-password" data-target="login-password">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                        <span class="error-msg" id="login-password-err"></span>
                    </div>

                    <div class="form-actions">
                        <label class="remember-me">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot-pass">Forgot Password?</a>
                    </div>

                    <button type="submit" class="submit-btn">Login</button>
                </form>
            </div>

            <!-- Signup Form -->
            <div id="signup-form" class="form-container">
                <div class="form-header">
                    <h2>Create Account</h2>
                    <p>Join us today! It takes only a minute.</p>
                </div>
                
                <form id="signup" novalidate>
                    <div class="input-group">
                        <label for="signup-name">Full Name</label>
                        <div class="input-icon">
                            <i class="fa-regular fa-user"></i>
                            <input type="text" id="signup-name" placeholder="John Doe" required minlength="3">
                        </div>
                        <span class="error-msg" id="signup-name-err"></span>
                    </div>

                    <div class="input-group">
                        <label for="signup-email">Email Address</label>
                        <div class="input-icon">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="email" id="signup-email" placeholder="hello@example.com" required>
                        </div>
                        <span class="error-msg" id="signup-email-err"></span>
                    </div>

                    <div class="input-group">
                        <label for="signup-password">Password</label>
                        <div class="input-icon">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="signup-password" placeholder="Min. 8 characters" required minlength="8">
                            <button type="button" class="toggle-password" data-target="signup-password">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                        <span class="error-msg" id="signup-password-err"></span>
                    </div>

                    <div class="input-group">
                        <label for="signup-confirm">Confirm Password</label>
                        <div class="input-icon">
                            <i class="fa-solid fa-lock-open"></i>
                            <input type="password" id="signup-confirm" placeholder="Confirm your password" required>
                            <button type="button" class="toggle-password" data-target="signup-confirm">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                        <span class="error-msg" id="signup-confirm-err"></span>
                    </div>

                    <div class="terms-group">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">I agree to the Terms & Conditions</label>
                    </div>
                    <span class="error-msg" id="terms-err"></span>

                    <button type="submit" class="submit-btn mt-1">Create Account</button>
                </form>
            </div>
            
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
